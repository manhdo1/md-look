<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>markdown-look</title>
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/marktext-preview.css" />
    <link rel="stylesheet" href="styles/hljs-marktext.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div id="titlebar-left">
          <button
            type="button"
            id="btn-outline"
            class="icon-btn"
            title="Toggle outline"
            aria-label="Toggle outline"
            aria-pressed="true"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M2 3h12v1.5H2V3zm0 4.25h12v1.5H2v-1.5zm0 4.25h8V13H2v-1.5z"
              />
            </svg>
          </button>
        </div>
        <span id="path-label" title=""></span>
        <div id="titlebar-actions">
          <button
            type="button"
            id="btn-open"
            class="icon-btn"
            title="Open (Ctrl+O)"
            aria-label="Open file"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.379a1.5 1.5 0 0 1 1.06.44l1.122 1.12H13A1.5 1.5 0 0 1 14.5 4.5v8A1.5 1.5 0 0 1 13 14H3A1.5 1.5 0 0 1 1.5 12.5V3zm1.5-.1a.1.1 0 0 0-.1.1v9.5c0 .055.045.1.1.1h10a.1.1 0 0 0 .1-.1v-8a.1.1 0 0 0-.1-.1H8.06a1 1 0 0 1-.707-.293L6.232 2.9H3z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-find"
            class="icon-btn"
            title="Find (Ctrl+F)"
            aria-label="Find in document"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M11.5 6.5a5 5 0 1 1-10 0 5 5 0 0 1 10 0zm-.82 4.74a6.5 6.5 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-theme"
            class="icon-btn"
            title="Toggle theme"
            aria-label="Toggle light and dark theme"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM8 13A5 5 0 0 1 8 3v10z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div id="error-banner" role="alert"></div>

      <div id="find-bar" hidden>
        <input
          id="find-input"
          type="search"
          placeholder="Find in document…"
          autocomplete="off"
          aria-label="Find in document"
        />
        <span id="find-count" aria-live="polite"></span>
        <button type="button" id="find-prev" title="Previous match" aria-label="Previous match">
          Prev
        </button>
        <button type="button" id="find-next" title="Next match" aria-label="Next match">Next</button>
        <button type="button" id="find-close" title="Close find" aria-label="Close find">
          Close
        </button>
      </div>

      <div id="main">
        <aside id="sidebar" aria-label="Document outline">
          <h2>Outline</h2>
          <ul id="outline-list"></ul>
        </aside>
        <div
          id="resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize outline"
          tabindex="0"
        ></div>
        <div id="reader">
          <div id="preview-scroll">
            <div id="empty" class="visible">
              <div class="empty-card">
                <p class="empty-title">No file open</p>
                <p class="empty-hint">Open a Markdown file, or drop one here.</p>
                <button type="button" id="btn-open-empty" class="primary-btn">Open file</button>
                <div id="recent" hidden>
                  <h3>Recent files</h3>
                  <ul id="recent-list"></ul>
                </div>
              </div>
            </div>
            <article id="article" hidden></article>
          </div>
          <footer id="statusbar">
            <div id="status-left">
              <span id="status-format" class="status-chip">Markdown</span>
              <span id="status-hint" class="status-muted"></span>
            </div>
            <div id="status-right">
              <div id="zoom-group" role="group" aria-label="Zoom">
                <button
                  type="button"
                  id="btn-zoom-out"
                  class="status-btn"
                  title="Zoom out (Ctrl+-)"
                  aria-label="Zoom out"
                >
                  −
                </button>
                <button
                  type="button"
                  id="zoom-label"
                  class="status-btn status-zoom"
                  title="Reset zoom (Ctrl+0)"
                  aria-label="Zoom level, click to reset"
                >
                  100%
                </button>
                <button
                  type="button"
                  id="btn-zoom-in"
                  class="status-btn"
                  title="Zoom in (Ctrl+=)"
                  aria-label="Zoom in"
                >
                  +
                </button>
              </div>
              <span class="status-sep" aria-hidden="true"></span>
              <span id="word-count" class="status-muted"></span>
            </div>
          </footer>
        </div>
      </div>
    </div>

    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>

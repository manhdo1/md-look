[package]
name = "markdown-look"
version = "0.2.0"
description = "A lightweight read-only Markdown viewer for Windows"
authors = ["markdown-look"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "markdown_look_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
ammonia = "4"
notify = "7"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
